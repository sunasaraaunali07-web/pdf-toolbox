<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free, fast, and private PDF tools. Merge, compress, split, convert, and edit PDFs entirely in your browser — no uploads required." />

    <title>PDFToolbox — Free PDF Tools Online</title>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter font — self-contained subset, loads fast -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon placeholder — replace with a real .ico / .svg -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>
  <body>
    <!-- Skip-to-content for keyboard users -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- React/Vue/etc would mount here; we mount vanilla TS directly -->
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
